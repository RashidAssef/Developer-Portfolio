<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <button>Home</button>
        <button>Youtube Channel</button>
    </nav>
    <div class="gap">.</div>

    <h1>BMI Calculator</h1>

    <div class="height">
        <p>Height in CM :</p>
        <input type="text" name="height" id="h" value="">
    </div>

    <div class="weight">
        <p>Weight in KG :</p>
        <input type="text" name="weight" id="w" value="">
    </div>

    <div id="result"></div>

    <button id="calc">Calculate</button>

    <div class="dets">
        <h3>BMI Weight Guide</h3>
        <p>Under Weight = Less Than 18.6</p>
        <p>Normal Range = 18.6 To 24.9</p>
        <p>OverWeight = Greater Than 24.9</p>
    </div>
    

    <script src="./app.js"></script>

</body>
</html>
